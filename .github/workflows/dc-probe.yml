name: Datacentre Energy Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Host facts
        run: |
          echo "=== virtualisation ==="
          sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "(no brand string)"
          sysctl -n kern.hv_vmm_present 2>/dev/null && echo "^ kern.hv_vmm_present (1 = running under a hypervisor)"
          sysctl -n hw.model 2>/dev/null
          sysctl -n hw.ncpu hw.memsize 2>/dev/null
          echo "=== IOReport / SMC power services (the counter source) ==="
          ioreg -c IOReportHub -d 1 2>/dev/null | head -5 || echo "no IOReportHub"
          ioreg -rc AppleSMC 2>/dev/null | head -3 || echo "no AppleSMC"
          echo "=== powermetrics (system scope, needs root) ==="
          sudo -n powermetrics --samplers cpu_power -n 1 -i 200 2>&1 | head -20 || echo "powermetrics failed"
      - run: npm ci && npx playwright install firefox && npm run build
      - name: Doctor (now probes for real samples)
        run: node dist/cli/index.js doctor || true
