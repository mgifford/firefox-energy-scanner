name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Only builds the index; Lighthouse (optional) is not needed here.
      - run: npm ci --omit=optional
      - run: npm run build

      - name: Rebuild results index
        # Keeps the published index consistent with whatever result files are
        # committed, even if a scan job committed results without reindexing.
        run: |
          mkdir -p site/results
          node dist/cli/index.js build-index --dir site/results --out site/results/index.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
