name: Tests

# Type-check and unit tests on every pull request (including Dependabot's)
# and on main. A major dependency bump that breaks the build shows up as a
# failed check on its pull request, before merge, rather than as every scan
# and Pages deploy failing afterwards.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A full install: --omit=optional would also drop the platform-specific
      # native packages the test runner needs. The npm cache keeps it cheap.
      - run: npm ci

      - run: npm test

  # Real Firefox against a small local site served as site.test and
  # www.site.test, the first redirecting to the second. Covers what unit tests
  # cannot: that a crawl follows a www redirect and reaches every page once,
  # that a PDF in a list is reported as "not a web page", and that
  # --public-only refuses local addresses in a real browser.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=optional
      - run: npx playwright install --with-deps firefox
      - run: npm run build

      - name: Map the test site's host names to this machine
        # looks-public.example.com stands in for a public name that points at
        # this machine, as DDEV's *.ddev.site names do.
        run: echo "127.0.0.1 site.test www.site.test looks-public.example.com" | sudo tee -a /etc/hosts

      - run: node tests/e2e/crawl-e2e.mjs
