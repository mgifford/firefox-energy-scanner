name: Run energy scan

# Processes a scan request filed as an issue titled "SCAN: ...".
#
# Energy measurement requires PHYSICAL Apple Silicon. Verified empirically:
#   ubuntu-latest      -> x86_64, no power counters
#   macos-latest       -> arm64 but VIRTUALISED (VirtualMac2,1); the counter
#                         exists and emits zero samples, so no energy
#   self-hosted macOS  -> real hardware, real energy
# See docs/decision-record.md TDR-007 and TDR-008.

# Security: the issue body is untrusted. It is only ever read as data — from a
# file, an environment variable or argv — and never pasted into a script with
# `${{ }}`. tests/workflow-scripts.test.ts enforces that.

on:
  issues:
    # The issue is the run control. A finished scan closes it; any of these
    # runs it again:
    #   reopened — reopen a closed request
    #   edited   — save a change to an OPEN request (e.g. fix a rejected one)
    #   labeled  — add the `rescan` label to any request, open or closed
    types: [opened, reopened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true

permissions:
  contents: read

# One group per issue, and the newest request wins. Reopening and adding
# `rescan`, or reopening and then saving an edit, are two triggers seconds
# apart; each run reads the issue body as it is when it starts, so queuing
# them scanned the same request twice (issue #11). A newer trigger cancels
# the run still in progress and scans the latest body instead. Different
# issues never cancel each other. Self-hosted energy scans still run one at a
# time, because there is one machine.
concurrency:
  group: energy-scan-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

jobs:
  prepare:
    # Only act on scan requests. Anyone can open an issue, so the body is
    # treated as untrusted input and validated before anything runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'SCAN:') &&
       (github.event.action != 'edited' ||
        (github.event.issue.state == 'open' && (github.event.changes.body || github.event.changes.title))) &&
       (github.event.action != 'labeled' || github.event.label.name == 'rescan'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To acknowledge the request and clear the `rescan` label.
      issues: write
    outputs:
      mode: ${{ steps.parse.outputs.mode }}
      urls: ${{ steps.parse.outputs.urls }}
      runner: ${{ steps.parse.outputs.runner }}
      runs: ${{ steps.parse.outputs.runs }}
      max_pages: ${{ steps.parse.outputs.max_pages }}
      include: ${{ steps.parse.outputs.include }}
      viewport_width: ${{ steps.parse.outputs.viewport_width }}
      viewport_height: ${{ steps.parse.outputs.viewport_height }}
      lighthouse: ${{ steps.parse.outputs.lighthouse }}
      lighthouse_runs: ${{ steps.parse.outputs.lighthouse_runs }}
      lighthouse_scope: ${{ steps.parse.outputs.lighthouse_scope }}
      runs_on: ${{ steps.parse.outputs.runs_on }}
      energy_machine: ${{ steps.parse.outputs.energy_machine }}
      issue: ${{ steps.parse.outputs.issue }}
      valid: ${{ steps.parse.outputs.valid }}
      errors: ${{ steps.parse.outputs.errors }}
      notes: ${{ steps.parse.outputs.notes }}
      not_scanned: ${{ steps.parse.outputs.not_scanned }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # This job only parses the issue, so skip optional dependencies
      # (Lighthouse and its Chrome tooling): less to download on every request.
      - run: npm ci --omit=optional
      - run: npm run build

      - name: Read issue body
        id: body
        uses: actions/github-script@v9
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.issue.number;
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const fs = require('fs');
            // Write to a file rather than an output to avoid any shell
            // interpolation of user-controlled text.
            fs.writeFileSync('issue-body.txt', data.body || '', 'utf8');
            // The title too: an issue opened without the form may name its
            // URL only there ("SCAN: ottawa.ca").
            fs.writeFileSync('issue-title.txt', data.title || '', 'utf8');
            core.setOutput('number', String(number));

            // Clear the label so it can be added again for the next rescan.
            if (context.payload.action === 'labeled' && context.payload.label?.name === 'rescan') {
              await github.rest.issues
                .removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, name: 'rescan' })
                .catch(() => {});
            }

      - name: Parse and validate request
        id: parse
        env:
          ISSUE_NUMBER: ${{ steps.body.outputs.number }}
          # Labels of this repository's energy-measuring machine, if one is
          # registered, e.g. "self-hosted,macOS,ARM64". GitHub's own token
          # cannot list runners, so the repository says so explicitly.
          ENERGY_RUNNER: ${{ vars.ENERGY_RUNNER }}
        run: |
          set +e
          node dist/cli/index.js parse-issue --file issue-body.txt --title-file issue-title.txt > request.json
          set -e
          cat request.json
          # Emitting outputs from Node avoids quoting user-controlled text in shell.
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const r = JSON.parse(readFileSync('request.json', 'utf8'));
          const out = [];
          // A newline in a single-line value would start a new output, letting
          // the issue body set any output it liked. Strip them.
          const set = (k, v) => out.push(`${k}=${String(v ?? '').replace(/[\r\n]+/g, ' ')}`);
          // A fixed heredoc delimiter could be typed into the issue to end the
          // value early; a random one cannot be guessed.
          const setMultiline = (k, v) => {
            const d = `EOF_${randomUUID()}`;
            out.push(`${k}<<${d}`, v ?? '', d);
          };
          set('issue', process.env.ISSUE_NUMBER);
          set('mode', r.mode);
          set('runner', r.runner);
          set('runs', String(r.runs));
          set('max_pages', String(r.maxPages));
          set('include', r.include ?? '');
          set('viewport_width', String(r.viewport.width));
          set('viewport_height', String(r.viewport.height));
          set('lighthouse', r.lighthouse);
          set('lighthouse_runs', String(r.lighthouseRuns));
          set('lighthouse_scope', r.lighthouseScope);
          // Where to run. Every GitHub-hosted machine is a virtual machine and
          // cannot measure energy (tested: the Energy probe workflow), so
          // "auto" means the repository's own machine when one is set up.
          const labels = (process.env.ENERGY_RUNNER || '').split(',').map((l) => l.trim()).filter(Boolean);
          const labelsOk = labels.length > 0 && labels.every((l) => /^[\w.-]+$/.test(l));
          const energyMachine = r.runner === 'auto' && labelsOk;
          set('energy_machine', energyMachine ? 'true' : 'false');
          set('energy_labels', labels.join(', '));
          set('runs_on', JSON.stringify(energyMachine ? labels : r.runner === 'macos' ? 'macos-latest' : 'ubuntu-latest'));
          set('valid', r.errors.length === 0 && r.urls.length > 0 ? 'true' : 'false');
          set('url_count', String(r.urls.length));
          set('not_scanned_count', String((r.notScanned ?? []).length));
          setMultiline('urls', r.urls.join('\n'));
          setMultiline('errors', r.errors.join('\n'));
          setMultiline('notes', r.notes.join('\n'));
          setMultiline('not_scanned', JSON.stringify(r.notScanned ?? []));
          set('estimate', String(Math.max(1, Math.round(r.estimatedMinutes ?? 0))));
          appendFileSync(process.env.GITHUB_OUTPUT, out.join('\n') + '\n', 'utf8');
          NODE

      # Say the request was picked up, so a re-run is visible straight away
      # rather than only when results arrive.
      - name: Acknowledge the request
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue }}
          ESTIMATE: ${{ steps.parse.outputs.estimate }}
          URL_COUNT: ${{ steps.parse.outputs.url_count }}
          NOT_SCANNED_COUNT: ${{ steps.parse.outputs.not_scanned_count }}
          SCAN_MODE: ${{ steps.parse.outputs.mode }}
          MAX_PAGES: ${{ steps.parse.outputs.max_pages }}
          ENERGY_MACHINE: ${{ steps.parse.outputs.energy_machine }}
          ENERGY_LABELS: ${{ steps.parse.outputs.energy_labels }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const skipped = Number(process.env.NOT_SCANNED_COUNT || 0);
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const marker = '<!-- scan-started -->';
            const body = [
              marker,
              (process.env.SCAN_MODE === 'crawl'
                ? `**Scan started:** crawling the site, up to ${process.env.MAX_PAGES} pages`
                : `**Scan started** for ${process.env.URL_COUNT} page${process.env.URL_COUNT === '1' ? '' : 's'}`) +
                ` — about ${process.env.ESTIMATE} min. [Follow the run](${run}).`,
              process.env.ENERGY_MACHINE === 'true'
                ? `Running on this repository's energy-measuring machine (\`${process.env.ENERGY_LABELS}\`); it starts when that machine is free.`
                : "Running in GitHub's cloud, which cannot measure energy, so each page is visited once.",
              skipped
                ? `${skipped} listed URL${skipped === 1 ? ' is' : 's are'} not included; the results will list ${skipped === 1 ? 'it' : 'them'}.`
                : null,
              'Results will be posted here, and the issue closed, when it finishes.',
            ].filter(Boolean).join('\n\n');

            // If the bot's latest comment is a "Scan started" from a run this
            // one superseded, edit it rather than leave a start with no result.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const lastBot = comments.filter((c) => c.user && c.user.type === 'Bot').pop();
            if (lastBot && lastBot.body && lastBot.body.includes(marker)) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: lastBot.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  scan:
    needs: prepare
    if: needs.prepare.outputs.valid == 'true'
    # Chosen by the prepare job: the repository's energy-measuring machine when
    # ENERGY_RUNNER names one, otherwise GitHub's cloud.
    runs-on: ${{ fromJSON(needs.prepare.outputs.runs_on) }}
    # The request budget is 90 minutes of scanning; this leaves room for
    # checkout, install, commit and comment without hitting the 360-minute cap.
    timeout-minutes: 120
    outputs:
      # webNRG measurements this scan requested and has not seen finish.
      webnrg_pending: ${{ steps.scan.outputs.webnrg_pending }}
    permissions:
      # To push to the scan-results branch (never to main).
      contents: write
      issues: write
      # To open or update the one rolling results pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # What this scan job itself uses, estimated by Eco CI from CPU use with a
      # model of GitHub's runners. Only on those runners: on a self-hosted
      # machine the model does not apply. send-data is off, so nothing goes to
      # Green Coding. Pinned to a commit, as for any third-party action.
      - name: Start estimating this job's energy
        if: runner.environment == 'github-hosted'
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Lighthouse is an optional dependency; install it only when requested.
      - name: Install dependencies
        env:
          LIGHTHOUSE: ${{ needs.prepare.outputs.lighthouse }}
        run: |
          if [ "$LIGHTHOUSE" = "none" ] || [ -z "$LIGHTHOUSE" ]; then
            npm ci --omit=optional
          else
            npm ci
          fi
      - run: npx playwright install firefox
      - run: npm run build

      # Hosted runners ship Google Chrome. A self-hosted Mac may not, so fall
      # back to Playwright's Chromium rather than failing the Lighthouse step.
      - name: Ensure a Chrome for Lighthouse
        if: needs.prepare.outputs.lighthouse != 'none'
        run: |
          node --input-type=module -e "const m = await import('chrome-launcher'); m.getChromePath();" \
            || npx playwright install chromium

      # Firefox reads Linux RAPL power counters only when perf_event_paranoid
      # is 0 or lower. Hosted runners are virtual machines and are not expected
      # to expose RAPL, but setting this costs nothing and lets the run prove
      # it either way. Only on disposable hosted runners: on a self-hosted
      # machine this is the owner's decision (docs/local-energy.md).
      - name: Allow Firefox to read RAPL power counters
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo sysctl -w kernel.perf_event_paranoid=0 || true

      # Probes for a working energy path with a real Firefox session and says
      # why not, if not. The scan repeats the check on its own profile.
      - name: Energy check
        run: node dist/cli/index.js doctor || true

      - name: Run scan
        id: scan
        env:
          SCAN_MODE: ${{ needs.prepare.outputs.mode }}
          SCAN_URLS: ${{ needs.prepare.outputs.urls }}
          SCAN_RUNS: ${{ needs.prepare.outputs.runs }}
          SCAN_MAX_PAGES: ${{ needs.prepare.outputs.max_pages }}
          SCAN_INCLUDE: ${{ needs.prepare.outputs.include }}
          SCAN_VIEWPORT: ${{ needs.prepare.outputs.viewport_width }}x${{ needs.prepare.outputs.viewport_height }}
          SCAN_LIGHTHOUSE: ${{ needs.prepare.outputs.lighthouse }}
          SCAN_LIGHTHOUSE_RUNS: ${{ needs.prepare.outputs.lighthouse_runs }}
          SCAN_LIGHTHOUSE_SCOPE: ${{ needs.prepare.outputs.lighthouse_scope }}
          ENERGY_MACHINE: ${{ needs.prepare.outputs.energy_machine }}
          # Set the repository variable WEBNRG to "off" to stop sending pages
          # to webNRG, or to "lookup" to only reuse results it already has.
          WEBNRG: ${{ vars.WEBNRG }}
        run: |
          mkdir -p site/results
          # URLs come from an env var and are passed as argv, never interpolated
          # into the shell, so a hostile issue body cannot inject a command.
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { readdirSync, readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { planRuns } from './dist/cli/issue-parser.js';
          import { webnrgMarkdown } from './dist/webnrg/markdown.js';
          const urls = (process.env.SCAN_URLS || '').split('\n').map(s => s.trim()).filter(Boolean);
          if (urls.length === 0) { console.error('no urls'); process.exit(1); }

          const mode = process.env.SCAN_MODE === 'crawl' ? 'crawl' : 'measure';
          // The parser emits WIDTHxHEIGHT from bounded integers; anything else
          // is dropped rather than passed through.
          const viewport = /^\d{2,5}x\d{2,5}$/.test(process.env.SCAN_VIEWPORT || '')
            ? ['--viewport', process.env.SCAN_VIEWPORT] : [];
          const lh = process.env.SCAN_LIGHTHOUSE;
          // Full HTML reports go to a short-lived workflow artifact, not the
          // repository: each is ~0.5 MB and the summary is what gets published.
          const lighthouse = lh === 'performance' || lh === 'all'
            ? ['--lighthouse',
               '--lighthouse-categories', lh === 'all' ? 'all' : 'performance',
               '--lighthouse-runs', process.env.SCAN_LIGHTHOUSE_RUNS || '1',
               '--lighthouse-top', process.env.SCAN_LIGHTHOUSE_SCOPE === 'every' ? 'all' : '10',
               '--lighthouse-reports', 'lighthouse-reports']
            : [];
          // One cold visit per page in the cloud; repeated runs only where
          // energy can be measured, scaled to fit the budget.
          const plan = planRuns(urls.length, process.env.ENERGY_MACHINE === 'true', Number(process.env.SCAN_RUNS) || undefined);
          // Anyone can submit a URL, so the browsers may only reach public
          // addresses: never localhost, a home network or a DDEV site. On a
          // runner at home this is what keeps a request out of the network.
          const guard = ['--public-only'];
          // CO2.js counts bytes from green-hosted domains as such. The domain
          // names go to the Green Web Foundation after Firefox has closed.
          const greenHosting = ['--green-hosting'];
          // A lab figure from webNRG (Green Coding's Green Metrics Tool
          // cluster) for up to three pages: reused if measured in the last
          // 30 days, otherwise requested. Never waits; a later job collects.
          const webnrg = process.env.WEBNRG === 'off' ? []
            : process.env.WEBNRG === 'lookup' ? ['--webnrg-lookup-only', '--webnrg-top', '3']
            : ['--webnrg', '--webnrg-top', '3'];
          const args = mode === 'crawl'
            ? ['dist/cli/index.js', 'crawl', urls[0],
               '--max-pages', process.env.SCAN_MAX_PAGES || '20',
               // A sample of the pages the sitemap lists, as open-scans takes;
               // following links only when there is no usable sitemap.
               '--sample',
               ...(process.env.SCAN_INCLUDE ? ['--include', process.env.SCAN_INCLUDE] : []),
               ...viewport, ...lighthouse, ...guard, ...webnrg, ...greenHosting,
               '--headless', '--out', 'site/results']
            : ['dist/cli/index.js', 'measure', ...urls,
               '--runs', String(plan.runs),
               '--warmups', String(plan.warmups),
               ...viewport, ...lighthouse, ...guard, ...webnrg, ...greenHosting,
               '--headless', '--out', 'site/results'];

          console.log('mode:', mode, '| targets:', urls.length, '| runs:', plan.runs, '| warmups:', plan.warmups);
          const before = new Set(readdirSync('site/results'));
          // Below the 90-minute request budget, leaving room for setup/commit.
          const r = spawnSync('node', args, { stdio: 'inherit', timeout: 95 * 60 * 1000 });
          // Name this run's own result file, so the comment never summarises
          // another scan that lands in the repository at the same time.
          const mine = readdirSync('site/results').filter((f) => f.endsWith('.json') && !before.has(f));
          if (mine.length) {
            const file = mine.sort().pop();
            appendFileSync(process.env.GITHUB_OUTPUT, `result=${file}\n`);
            // The webNRG section of the comment, and the requests still
            // running, for the follow-up job. URLs were validated as public
            // http(s) and job ids are numbers, so the JSON is one line.
            try {
              const summary = JSON.parse(readFileSync(`site/results/${file}`, 'utf8')).webnrg;
              if (summary) {
                const pending = summary.pages.filter((p) => p.status === 'submitted');
                writeFileSync('webnrg-comment.md', webnrgMarkdown(summary, { followUp: pending.length > 0 }));
                if (pending.length) {
                  appendFileSync(process.env.GITHUB_OUTPUT, `webnrg_pending=${JSON.stringify({ ...summary, pages: pending })}\n`);
                }
              }
            } catch (e) {
              console.log('No webNRG section:', e.message);
            }
          }
          process.exit(r.status ?? 1);
          NODE

      - name: Upload full Lighthouse reports
        id: lh-artifact
        if: needs.prepare.outputs.lighthouse != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-issue-${{ needs.prepare.outputs.issue }}
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: ignore

      # Built for the comment below. Not committed: the Pages deploy builds its
      # own, and a shared index file made concurrent scans conflict on push.
      - name: Rebuild results index
        run: node dist/cli/index.js build-index --dir site/results --out site/results/index.json

      # Results are never pushed to main. They go to ONE long-lived branch,
      # `scan-results`, with ONE open pull request that collects every scan
      # until someone merges it; merging publishes them (the Pages deploy runs
      # on that push to main). So there is only ever one results branch.
      - name: Commit results to the scan-results branch
        id: commit
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
          RESULTS_BRANCH: scan-results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/results
          if git diff --cached --quiet; then
            echo "No new results to commit."
            exit 0
          fi
          git commit -q -m "Add scan results for issue #${ISSUE_NUMBER}"
          RESULT_COMMIT=$(git rev-parse HEAD)

          # Other scans may push at the same time. Each adds only its own new
          # files, so replaying this commit on the latest branch always works.
          for attempt in 1 2 3 4 5; do
            git fetch -q --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            REMOTE_SHA=$(git ls-remote --heads origin "$RESULTS_BRANCH" | cut -f1)
            BASE=origin/main
            if [ -n "$REMOTE_SHA" ]; then
              git fetch -q --depth=1 origin "+refs/heads/$RESULTS_BRANCH:refs/remotes/origin/$RESULTS_BRANCH"
              # Keep building on the branch while it holds results that main
              # does not (its pull request is open, or was closed unmerged).
              # Once all of it has reached main, start again from main, so a
              # squash-merged history is never offered for review twice.
              if [ -n "$(git diff --name-only --diff-filter=A origin/main "origin/$RESULTS_BRANCH" -- site/results)" ]; then
                BASE="origin/$RESULTS_BRANCH"
              fi
            fi
            git checkout -q -B "$RESULTS_BRANCH" "$BASE"
            git cherry-pick "$RESULT_COMMIT" > /dev/null
            if [ -n "$REMOTE_SHA" ]; then
              # The lease fails if another scan pushed since the fetch; retry.
              git push -q --force-with-lease="$RESULTS_BRANCH:$REMOTE_SHA" origin "$RESULTS_BRANCH" && pushed=1 || pushed=0
            else
              git push -q origin "$RESULTS_BRANCH" && pushed=1 || pushed=0
            fi
            if [ "$pushed" = 1 ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push results after 5 attempts." >&2
          exit 1

      - name: Open or update the results pull request
        id: results-pr
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
          RESULT_FILE: ${{ steps.scan.outputs.result }}
        with:
          script: |
            const branch = 'scan-results';
            const { owner, repo } = context.repo;
            const issue = Number(process.env.ISSUE_NUMBER);
            // Result file names are generated by the CLI (mode + timestamp).
            const file = /^[\w.-]+$/.test(process.env.RESULT_FILE || '') ? process.env.RESULT_FILE : 'results';
            const line = `- #${issue} — \`${file}\``;
            const header = [
              'Results from issue-driven scans collect in this pull request. **Merging it publishes them** to',
              'the site: the Pages deploy runs on the merge and rebuilds the results index.',
              '',
              'While this is open, later scans add their results here. Once it is merged, the next scan opens',
              'a new pull request from the same `scan-results` branch, so there is only ever one.',
              '',
              '**Scans included:**',
            ].join('\n');
            try {
              const open = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
              let pr = open.data[0];
              if (!pr) {
                pr = (await github.rest.pulls.create({
                  owner, repo, head: branch, base: 'main', title: 'Scan results', body: `${header}\n${line}`,
                })).data;
              } else if (!(pr.body || '').includes(line)) {
                await github.rest.pulls.update({
                  owner, repo, pull_number: pr.number, body: `${(pr.body || header).trimEnd()}\n${line}`,
                });
              }
              core.setOutput('url', pr.html_url);
            } catch (err) {
              // Most often the repository setting that lets Actions open pull
              // requests is off. The results are safe on the branch either way.
              core.warning(`Could not open the results pull request: ${err.message}`);
              core.setOutput('error', String(err.message).split('\n')[0].slice(0, 200));
              core.setOutput('compare', `${context.serverUrl}/${owner}/${repo}/compare/main...${branch}?expand=1`);
            }

      # Only report success when the scan actually produced results. A failure
      # is handled by the step below, so the issue never sits open in silence.
      - name: Estimate this job's energy so far
        id: eco-ci
        if: success() && runner.environment == 'github-hosted'
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: scan

      - name: Comment on the issue
        if: success()
        uses: actions/github-script@v9
        env:
          ECO_CI_LAP: ${{ steps.eco-ci.outputs.data-lap-json }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
          REQUESTED_RUNNER: ${{ needs.prepare.outputs.runner }}
          ENERGY_MACHINE: ${{ needs.prepare.outputs.energy_machine }}
          SCAN_MODE: ${{ needs.prepare.outputs.mode }}
          PARSER_NOTES: ${{ needs.prepare.outputs.notes }}
          NOT_SCANNED: ${{ needs.prepare.outputs.not_scanned }}
          RESULT_FILE: ${{ steps.scan.outputs.result }}
          LH_ARTIFACT_URL: ${{ steps.lh-artifact.outputs.artifact-url }}
          RESULTS_PR_URL: ${{ steps.results-pr.outputs.url }}
          RESULTS_PR_ERROR: ${{ steps.results-pr.outputs.error }}
          RESULTS_COMPARE_URL: ${{ steps.results-pr.outputs.compare }}
        with:
          script: |
            const fs = require('fs');
            const onEnergyMachine = process.env.ENERGY_MACHINE === 'true';
            const noEnergyMachine = process.env.REQUESTED_RUNNER === 'auto' && !onEnergyMachine;

            // Listed URLs this scan left out (over the limit, not public, extra
            // crawl starts). Shown in code spans: the text comes from the issue,
            // and inside a code span it cannot ping anyone or inject markdown.
            let notScanned = [];
            try { notScanned = JSON.parse(process.env.NOT_SCANNED || '[]'); } catch (e) { notScanned = []; }
            const code = (t) => '`' + String(t).replace(/`/g, "'") + '`';

            let table = '';
            // Declared outside the try so the findings block below can use it.
            let entry = null;
            const shortName = (step) => (step.length > 50 ? '…' + step.slice(-48) : step);
            try {
              const index = JSON.parse(fs.readFileSync('site/results/index.json', 'utf8'));
              entry = process.env.RESULT_FILE
                ? index.entries.find((e) => e.file === process.env.RESULT_FILE) || null
                : index.entries[0];
              if (entry) {
                table = [
                  '',
                  '| Scenario | Transfer | Requests | CO2.js | Observed energy |',
                  '| --- | ---: | ---: | ---: | ---: |',
                  ...entry.scenarios.map(s => {
                    const name = shortName(s.step);
                    // A failed URL has no page behind it: show no numbers at
                    // all rather than ones that belong to another page.
                    if (s.failed) {
                      const why = s.notAPage
                        ? '_not a web page (file download)_'
                        : s.blocked ? '_blocked: private or local address_' : '_failed_';
                      return `| ${name} | — | — | — | ${why} |`;
                    }
                    const kb = (s.transferBytes / 1024).toFixed(0) + ' KB';
                    const co2 = s.co2Grams != null
                      ? (s.co2Grams * 1000).toFixed(3) + ' mg' +
                        (s.co2GreenShare != null ? ` (${Math.round(s.co2GreenShare * 100)}% green-hosted)` : '')
                      : '—';
                    // "Not measured" (no power hardware) and "not resolved"
                    // (measured, but below the noise floor) are different
                    // statements; conflating them misreports the host.
                    const energy = !entry.energyAvailable
                      ? '_not measured_'
                      : (s.resolved && s.energyMwh != null)
                        ? s.energyMwh.toFixed(3) + ' mWh'
                        : '_not resolved_';
                    return `| ${name} | ${kb} | ${s.requests} | ${co2} | ${energy} |`;
                  }),
                ].join('\n');
              }
            } catch (e) {
              table = '\n_Could not summarise results._';
            }
            const failedRows = ((entry && entry.scenarios) || []).filter((s) => s.failed);
            const energyMeasured = !!(entry && entry.energyAvailable);
            const check = (entry && entry.energyCheck) || null;
            const wideScope = check && (check.scope === 'cpu-package' || check.scope === 'system');

            // Lighthouse is a separate engine and boundary, so it gets its own
            // table rather than extra columns on the Firefox one.
            // Written by the scan step from the result file (src/webnrg/markdown.ts).
            let webnrgBlock = '';
            try { webnrgBlock = '\n\n' + fs.readFileSync('webnrg-comment.md', 'utf8').trim(); } catch (e) { webnrgBlock = ''; }

            // The scan job's own footprint (Eco CI), on GitHub's runners only.
            let footprintBlock = '';
            try {
              const steps = (JSON.parse(process.env.ECO_CI_LAP || '{}').steps || []);
              const joules = steps.reduce((t, s) => t + Number(s.energy_joules || 0), 0);
              const seconds = steps.reduce((t, s) => t + Number(s.time || 0), 0);
              if (joules > 0) {
                footprintBlock = `\n\n**This scan's own footprint:** about ${(joules / 3600).toFixed(2)} Wh over ` +
                  `${Math.round(seconds / 60)} min on GitHub's runner. An Eco CI estimate from CPU use, not a measurement.`;
              }
            } catch (e) { footprintBlock = ''; }

            let lighthouseBlock = '';
            const lh = entry && entry.lighthouse;
            if (lh) {
              const sec = (ms) => (ms == null ? '—' : (ms / 1000).toFixed(1) + ' s');
              // The rating is written out so the score never relies on colour.
              const rating = (n) => (n == null ? '' : n >= 90 ? ' good' : n >= 50 ? ' needs improvement' : ' poor');
              const audited = entry.scenarios
                .filter((s) => s.lighthouse)
                .map((s) => ({ url: s.step, r: s.lighthouse }))
                .concat((lh.unmatched || []).map((r) => ({ url: r.url, r })));
              const extraCats = lh.categories.filter((c) => c !== 'performance');
              const rows = audited.map(({ url, r }) => {
                if (r.error && !r.runs) return `| ${shortName(url)} | _failed_ | — | — | — | — |` + extraCats.map(() => ' — |').join('');
                const perf = r.scores.performance;
                const range = r.performanceRange && r.performanceRange[0] !== r.performanceRange[1]
                  ? ` (${r.performanceRange[0]}–${r.performanceRange[1]})` : '';
                const top = r.recommendations[0] ? r.recommendations[0].title : '—';
                return `| ${shortName(url)} | **${perf ?? '—'}**${rating(perf)}${range} | ${sec(r.metrics.lcpMs)} | ` +
                  `${r.metrics.tbtMs ?? '—'} ms | ${r.metrics.cls ?? '—'} | ${top} |` +
                  extraCats.map((c) => ` ${r.scores[c] ?? '—'} |`).join('');
              });
              const catHead = extraCats.map((c) => ` ${c} |`).join('');
              const catSep = extraCats.map(() => ' ---: |').join('');
              const fmtSave = (x) => [
                x.medianSavingsMs ? '~' + (x.medianSavingsMs / 1000).toFixed(1) + ' s' : '',
                x.medianSavingsBytes ? '~' + Math.round(x.medianSavingsBytes / 1024) + ' KB' : '',
              ].filter(Boolean).join(', ');
              const common = (lh.sitewide || []).slice(0, 8).map((x) => {
                const save = fmtSave(x);
                const title = x.learnMore ? `[${x.title}](${x.learnMore})` : x.title;
                return `- ${title} — ${x.pages} of ${audited.length} page${audited.length === 1 ? '' : 's'}` +
                  (save ? ` · est. ${save} per page` : '');
              });
              const artifact = process.env.LH_ARTIFACT_URL || '';
              lighthouseBlock = [
                '',
                '### Lighthouse',
                '',
                `Lighthouse ${lh.version} in ${lh.browser || 'Chromium'}, ${lh.formFactor} profile, ` +
                  `${lh.throttling}. ` +
                  (lh.runsPerUrl === 1
                    ? 'One run per page, so a score can move a few points between scans.'
                    : `Median of ${lh.runsPerUrl} runs per page; range in brackets.`),
                '',
                `| Page | Performance | LCP | TBT | CLS | Top recommendation |${catHead}`,
                `| --- | ---: | ---: | ---: | ---: | --- |${catSep}`,
                ...rows,
                '',
                common.length ? '**Most common performance recommendations**' : null,
                common.length ? '' : null,
                ...common,
                common.length ? '' : null,
                'Failures shared by most pages usually come from the theme or a shared asset, so one fix lands everywhere.',
                '',
                artifact
                  ? `Full Lighthouse HTML reports (median run per URL) are in the [workflow artifact](${artifact}) for 14 days.`
                  : null,
                artifact ? '' : null,
                '_Lighthouse measures lab load performance in Chromium under simulated throttling. It is not ' +
                  'Firefox and not energy, and is reported beside those results, never combined with them._',
              ].filter((line) => line !== null).join('\n') + '\n';
            }

            const isCrawl = process.env.SCAN_MODE === 'crawl';

            // Structural findings need no power hardware, so they are the main
            // actionable output on a hosted runner.
            const allFindings = [];
            for (const s of ((entry && entry.scenarios) || [])) {
              for (const f of (s.findings || [])) {
                if (!allFindings.some((x) => x.id === f.id)) allFindings.push(f);
              }
            }
            const findingsBlock = allFindings.length
              ? '\n### Structural findings\n\n' +
                allFindings
                  .slice(0, 8)
                  .map((f) => `- **${f.severity.toUpperCase()}** ${f.title}\n  ${f.action}`)
                  .join('\n') +
                '\n\nThese come from page structure and need no power hardware, so they are ' +
                'valid on any runner.\n'
              : '';
            // Notes can quote the issue body; break @mentions so they ping nobody.
            const parserNotes = (process.env.PARSER_NOTES || '').trim().replace(/@/g, '@\u200b');

            const scannedCount = ((entry && entry.scenarios) || []).length;
            const shown = notScanned.slice(0, 50);
            const notScannedBlock = notScanned.length
              ? [
                  '',
                  `### Not scanned (${notScanned.length})`,
                  '',
                  ...shown.map((n) => `- ${code(n.url)} — ${n.reason}`),
                  notScanned.length > shown.length ? `- …and ${notScanned.length - shown.length} more` : null,
                  '',
                  notScanned.some((n) => /limit/.test(n.reason))
                    ? 'To scan the rest, open another request with them, or use crawl mode from the site’s home page.'
                    : null,
                ].filter((line) => line !== null).join('\n') + '\n'
              : '';
            const sampling = entry && entry.sampling;
            const coverage = notScanned.length && !isCrawl
              ? `\nScanned **${scannedCount}** of ${scannedCount + notScanned.length} listed URLs; the rest are listed under _Not scanned_ below.\n`
              : sampling && sampling.method === 'sitemap'
                ? `\n**Pages:** the start page and a sample of ${sampling.picked - 1} of the ${sampling.listed} pages its ` +
                  `sitemap lists. The same site gives the same sample, so a re-scan compares like with like.\n`
                : sampling
                  ? `\n**Pages:** ${sampling.picked}, found by following links from the start page (no usable sitemap).\n`
                  : '';

            const notes = [
              '',
              '**How to read this.** Modelled CO2e (CO2.js, from transferred bytes) and observed',
              'client energy (Firefox power counters) have different system boundaries and are not',
              'interchangeable. The measurement boundary is the client machine only — nothing here',
              'measures server or data-centre energy.',
              '',
              onEnergyMachine
                ? null
                : "_Ran in GitHub's cloud, visiting each page once. GitHub-hosted machines are virtual machines and cannot measure energy — tested on all six types by the Energy probe workflow._" +
                  (noEnergyMachine ? ' _No energy-measuring machine is set up for this repository (see docs/local-energy.md)._' : ''),
              // The run's own energy check: what this machine could measure,
              // and if nothing, why not and where it would work.
              energyMeasured
                ? `**Energy check: measured.** ${check ? check.reason : 'Firefox power counters produced samples.'}` +
                  (wideScope
                    ? ' The idle baseline is subtracted, but other activity on the machine still counts, so compare only runs made under the same conditions.'
                    : ' Check the power-source and Low Power Mode flags in the result before comparing against other runs.')
                : `**Energy check: not measured.** ${check ? check.reason : 'This host has no power-measurement hardware.'} ` +
                  'Network, CO2e, timing and page-structure metrics are all valid.',
              !energyMeasured && check && check.nextSteps && check.nextSteps.length
                ? '\n**Where energy can be measured:**\n' + check.nextSteps.map((x) => '- ' + x).join('\n')
                : null,
              '',
              energyMeasured
                ? '`not resolved` means the measured energy was smaller than its own run-to-run spread, ' +
                  'or at/below idle. Small static pages usually land here — there is nothing above the ' +
                  'noise floor to measure.'
                : '`not measured` means no energy reading was taken on this machine. It is an absence, not a zero.',
              failedRows.length
                ? `\n${failedRows.length} URL${failedRows.length === 1 ? '' : 's'} could not be measured. ` +
                  [
                    failedRows.some((s) => s.notAPage)
                      ? 'Rows marked _not a web page_ start a file download (usually a PDF) instead of rendering, so ' +
                        'there is nothing for a browser to lay out or paint. Link to the HTML page that hosts the file instead.'
                      : null,
                    failedRows.some((s) => s.blocked)
                      ? 'Rows marked _blocked_ lead, directly or by redirect, to a private or local address ' +
                        '(localhost, a home or office network, or a development name such as `*.ddev.site`). ' +
                        'Public scans never connect to those. To measure a local site, run the scanner on your own machine.'
                      : null,
                    failedRows.some((s) => !s.notAPage && !s.blocked) ? 'See the full results for the error.' : null,
                  ].filter(Boolean).join(' ')
                : null,
              parserNotes ? '\n**Notes on this request:**\n' + parserNotes.split('\n').map(n => '- ' + n).join('\n') : null,
              '',
              // Results reach the site only through the results pull request.
              process.env.RESULTS_PR_URL
                ? `**Publishing:** these results are in the [scan results pull request](${process.env.RESULTS_PR_URL}). ` +
                  'They appear on https://mgifford.github.io/firefox-energy-scanner/ once it is merged.'
                : process.env.RESULTS_COMPARE_URL
                  ? '**Publishing:** the results are on the `scan-results` branch, but the workflow could not open ' +
                    `a pull request (${process.env.RESULTS_PR_ERROR || 'unknown error'}). [Open it here](${process.env.RESULTS_COMPARE_URL}). ` +
                    'If the error mentions permission, turn on _Allow GitHub Actions to create and approve pull ' +
                    'requests_ under Settings → Actions → General.'
                  : 'Full results: https://mgifford.github.io/firefox-energy-scanner/',
            // Conditionals yield null when omitted; '' entries are deliberate
            // blank lines. filter(Boolean) dropped both, which collapsed every
            // paragraph break in the comment.
            ].filter((line) => line !== null).join('\n') + findingsBlock + lighthouseBlock + webnrgBlock + footprintBlock +
              '\n\n---\n_Scan complete, so this issue is now closed. **Reopen it to run the ' +
              'scan again** — edit the request body first if you want different settings._';

            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '## Scan complete\n' + coverage + table + '\n' + notScannedBlock + notes,
            });

            // The issue is the run control: closed means finished, and
            // reopening triggers a fresh scan (see the `reopened` trigger).
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed',
              state_reason: 'completed',
            });

      # Eco CI's table of this job's estimated energy, in the run summary.
      - name: Show this job's energy estimate
        if: always() && runner.environment == 'github-hosted'
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: display-results
          display-badge: false

      # If any earlier step failed the success comment is skipped, which would
      # otherwise leave the request open with no explanation. Say what happened
      # and leave the issue OPEN, since it has not been serviced.
      - name: Report a failed scan
        if: failure()
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                '## Scan failed',
                '',
                `The scan did not complete. [View the run log](${run}).`,
                '',
                'This issue stays open because the request has not been serviced.',
                'Common causes: the target was unreachable, or it did not respond within',
                'the time budget. To retry, edit the request (saving re-runs it), or close',
                'and reopen this issue.',
              ].join('\n'),
            });

  # webNRG measurements take 5-30 minutes in Green Coding's queue. Waiting for
  # them here, on a small GitHub-hosted machine, keeps the scan machine free.
  webnrg-results:
    needs: [prepare, scan]
    if: always() && needs.scan.result == 'success' && needs.scan.outputs.webnrg_pending != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --omit=optional
      - run: npm run build

      - name: Wait for the webNRG results
        env:
          PENDING: ${{ needs.scan.outputs.webnrg_pending }}
        run: |
          printf '%s' "$PENDING" > webnrg-pending.json
          node dist/cli/index.js webnrg-collect webnrg-pending.json --wait 45 --markdown webnrg-results.md

      - name: Add them to the issue
        if: always()
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('webnrg-results.md', 'utf8').trim(); } catch (e) { body = ''; }
            if (!body) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: body + '\n\n_Requests still running after 45 minutes stay linked above; a re-scan within ' +
                '30 days reuses them._',
            });

  report-invalid:
    needs: prepare
    if: needs.prepare.outputs.valid != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Explain why the request was rejected
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
          PARSER_ERRORS: ${{ needs.prepare.outputs.errors }}
        with:
          script: |
            // Shown as a quote of plain lines; it echoes text from the issue.
            const errors = (process.env.PARSER_ERRORS || '').trim()
              .split('\n').filter(Boolean).map((e) => '> ' + e.replace(/@/g, '@\u200b')).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                '## Scan request could not be processed',
                '',
                errors || 'No valid public http(s) URLs were found in this request.',
                '',
                'The quickest request is an issue titled `SCAN:` followed by the address, for example',
                '`SCAN: example.org`. Only public web addresses can be scanned: localhost, private',
                'networks and development sites are refused.',
                '',
                '**Edit this issue to fix the request.** Saving the edit runs it again automatically.',
              ].join('\n'),
            });
