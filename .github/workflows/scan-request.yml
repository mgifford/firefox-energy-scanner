name: Run energy scan

# Processes a scan request filed as an issue titled "SCAN: ...".
#
# Energy measurement requires PHYSICAL Apple Silicon. Verified empirically:
#   ubuntu-latest      -> x86_64, no power counters
#   macos-latest       -> arm64 but VIRTUALISED (VirtualMac2,1); the counter
#                         exists and emits zero samples, so no energy
#   self-hosted macOS  -> real hardware, real energy
# See docs/decision-record.md TDR-007 and TDR-008.

on:
  issues:
    # `reopened` makes the issue itself the re-run control: close when done,
    # reopen to scan again with the same (or an edited) request body.
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true

permissions:
  contents: read

concurrency:
  group: energy-scan
  cancel-in-progress: false

jobs:
  prepare:
    # Only act on scan requests. Anyone can open an issue, so the body is
    # treated as untrusted input and validated before anything runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'SCAN:')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.parse.outputs.mode }}
      urls: ${{ steps.parse.outputs.urls }}
      runner: ${{ steps.parse.outputs.runner }}
      runs: ${{ steps.parse.outputs.runs }}
      max_pages: ${{ steps.parse.outputs.max_pages }}
      include: ${{ steps.parse.outputs.include }}
      viewport_width: ${{ steps.parse.outputs.viewport_width }}
      viewport_height: ${{ steps.parse.outputs.viewport_height }}
      lighthouse: ${{ steps.parse.outputs.lighthouse }}
      lighthouse_runs: ${{ steps.parse.outputs.lighthouse_runs }}
      issue: ${{ steps.parse.outputs.issue }}
      runner_available: ${{ steps.runner-check.outputs.available }}
      valid: ${{ steps.parse.outputs.valid }}
      errors: ${{ steps.parse.outputs.errors }}
      notes: ${{ steps.parse.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This job only parses the issue, so skip optional dependencies
      # (Lighthouse and its Chrome tooling): less to download on every request.
      - run: npm ci --omit=optional
      - run: npm run build

      - name: Read issue body
        id: body
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.issue.number;
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const fs = require('fs');
            // Write to a file rather than an output to avoid any shell
            // interpolation of user-controlled text.
            fs.writeFileSync('issue-body.txt', data.body || '', 'utf8');
            core.setOutput('number', String(number));

      - name: Parse and validate request
        id: parse
        env:
          ISSUE_NUMBER: ${{ steps.body.outputs.number }}
        run: |
          set +e
          node dist/cli/index.js parse-issue --file issue-body.txt > request.json
          set -e
          cat request.json
          # Emitting outputs from Node avoids quoting user-controlled text in shell.
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('request.json', 'utf8'));
          const out = [];
          const set = (k, v) => out.push(`${k}=${v}`);
          const setMultiline = (k, v) => {
            const d = `EOF_${k.toUpperCase()}`;
            out.push(`${k}<<${d}`, v ?? '', d);
          };
          set('issue', process.env.ISSUE_NUMBER);
          set('mode', r.mode);
          set('runner', r.runner);
          set('runs', String(r.runs));
          set('max_pages', String(r.maxPages));
          set('include', r.include ?? '');
          set('viewport_width', String(r.viewport.width));
          set('viewport_height', String(r.viewport.height));
          set('lighthouse', r.lighthouse);
          set('lighthouse_runs', String(r.lighthouseRuns));
          set('valid', r.errors.length === 0 && r.urls.length > 0 ? 'true' : 'false');
          setMultiline('urls', r.urls.join('\n'));
          setMultiline('errors', r.errors.join('\n'));
          setMultiline('notes', r.notes.join('\n'));
          appendFileSync(process.env.GITHUB_OUTPUT, out.join('\n') + '\n', 'utf8');
          NODE

      # A self-hosted job queues indefinitely when no runner is registered, so
      # check first and fall back rather than leaving the request hanging.
      - name: Check for a registered self-hosted runner
        id: runner-check
        if: steps.parse.outputs.runner == 'self-hosted'
        uses: actions/github-script@v7
        with:
          script: |
            let available = false;
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              available = (data.runners || []).some(
                (r) => r.status === 'online' && !r.busy,
              );
              core.info(`self-hosted runners: ${data.total_count}, usable: ${available}`);
            } catch (err) {
              // Token may lack admin scope; assume unavailable rather than hang.
              core.warning(`Could not list self-hosted runners: ${err.message}`);
            }
            core.setOutput('available', available ? 'true' : 'false');

  scan:
    needs: prepare
    if: needs.prepare.outputs.valid == 'true'
    # Only a registered self-hosted macOS runner can measure energy. If one was
    # requested but is not online, fall back to a hosted runner so the request
    # still returns structural results instead of queuing forever.
    runs-on: >-
      ${{ (needs.prepare.outputs.runner == 'self-hosted' && needs.prepare.outputs.runner_available == 'true')
          && fromJSON('["self-hosted","macOS","ARM64"]')
          || (needs.prepare.outputs.runner == 'macos' && 'macos-latest' || 'ubuntu-latest') }}
    # The request budget is 90 minutes of scanning; this leaves room for
    # checkout, install, commit and comment without hitting the 360-minute cap.
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lighthouse is an optional dependency; install it only when requested.
      - name: Install dependencies
        env:
          LIGHTHOUSE: ${{ needs.prepare.outputs.lighthouse }}
        run: |
          if [ "$LIGHTHOUSE" = "none" ] || [ -z "$LIGHTHOUSE" ]; then
            npm ci --omit=optional
          else
            npm ci
          fi
      - run: npx playwright install firefox
      - run: npm run build

      # Hosted runners ship Google Chrome. A self-hosted Mac may not, so fall
      # back to Playwright's Chromium rather than failing the Lighthouse step.
      - name: Ensure a Chrome for Lighthouse
        if: needs.prepare.outputs.lighthouse != 'none'
        run: |
          node --input-type=module -e "const m = await import('chrome-launcher'); m.getChromePath();" \
            || npx playwright install chromium

      - name: Environment preflight
        run: node dist/cli/index.js doctor || true

      - name: Run scan
        env:
          SCAN_MODE: ${{ needs.prepare.outputs.mode }}
          SCAN_URLS: ${{ needs.prepare.outputs.urls }}
          SCAN_RUNS: ${{ needs.prepare.outputs.runs }}
          SCAN_MAX_PAGES: ${{ needs.prepare.outputs.max_pages }}
          SCAN_INCLUDE: ${{ needs.prepare.outputs.include }}
          SCAN_VIEWPORT: ${{ needs.prepare.outputs.viewport_width }}x${{ needs.prepare.outputs.viewport_height }}
          SCAN_LIGHTHOUSE: ${{ needs.prepare.outputs.lighthouse }}
          SCAN_LIGHTHOUSE_RUNS: ${{ needs.prepare.outputs.lighthouse_runs }}
        run: |
          mkdir -p site/results
          # URLs come from an env var and are passed as argv, never interpolated
          # into the shell, so a hostile issue body cannot inject a command.
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const urls = (process.env.SCAN_URLS || '').split('\n').map(s => s.trim()).filter(Boolean);
          if (urls.length === 0) { console.error('no urls'); process.exit(1); }

          const mode = process.env.SCAN_MODE === 'crawl' ? 'crawl' : 'measure';
          // The parser emits WIDTHxHEIGHT from bounded integers; anything else
          // is dropped rather than passed through.
          const viewport = /^\d{2,5}x\d{2,5}$/.test(process.env.SCAN_VIEWPORT || '')
            ? ['--viewport', process.env.SCAN_VIEWPORT] : [];
          const lh = process.env.SCAN_LIGHTHOUSE;
          // Full HTML reports go to a short-lived workflow artifact, not the
          // repository: each is ~0.5 MB and the summary is what gets published.
          const lighthouse = lh === 'performance' || lh === 'all'
            ? ['--lighthouse',
               '--lighthouse-categories', lh === 'all' ? 'all' : 'performance',
               '--lighthouse-runs', process.env.SCAN_LIGHTHOUSE_RUNS || '3',
               '--lighthouse-reports', 'lighthouse-reports']
            : [];
          const args = mode === 'crawl'
            ? ['dist/cli/index.js', 'crawl', urls[0],
               '--max-pages', process.env.SCAN_MAX_PAGES || '50',
               ...(process.env.SCAN_INCLUDE ? ['--include', process.env.SCAN_INCLUDE] : []),
               ...viewport, ...lighthouse,
               '--headless', '--out', 'site/results']
            : ['dist/cli/index.js', 'measure', ...urls,
               '--runs', process.env.SCAN_RUNS || '8',
               '--warmups', '2',
               ...viewport, ...lighthouse,
               '--headless', '--out', 'site/results'];

          console.log('mode:', mode, '| targets:', urls.length);
          // Below the 90-minute request budget, leaving room for setup/commit.
          const r = spawnSync('node', args, { stdio: 'inherit', timeout: 95 * 60 * 1000 });
          process.exit(r.status ?? 1);
          NODE

      - name: Upload full Lighthouse reports
        id: lh-artifact
        if: needs.prepare.outputs.lighthouse != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-issue-${{ needs.prepare.outputs.issue }}
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Rebuild results index
        run: node dist/cli/index.js build-index --dir site/results --out site/results/index.json

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/results
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Add scan results for issue #${{ needs.prepare.outputs.issue }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Only report success when the scan actually produced results. A failure
      # is handled by the step below, so the issue never sits open in silence.
      - name: Comment on the issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('site/results').filter(f => f.endsWith('.json') && f !== 'index.json');
            const latest = files.sort().pop();
            const requestedRunner = '${{ needs.prepare.outputs.runner }}';
            const selfHostedUsed =
              requestedRunner === 'self-hosted' &&
              '${{ needs.prepare.outputs.runner_available }}' === 'true';
            const fellBack = requestedRunner === 'self-hosted' && !selfHostedUsed;

            let table = '';
            // Declared outside the try so the findings block below can use it.
            let entry = null;
            const shortName = (step) => (step.length > 50 ? '…' + step.slice(-48) : step);
            try {
              const index = JSON.parse(fs.readFileSync('site/results/index.json', 'utf8'));
              entry = index.entries[0];
              if (entry) {
                table = [
                  '',
                  '| Scenario | Transfer | Requests | CO2.js | Observed energy |',
                  '| --- | ---: | ---: | ---: | ---: |',
                  ...entry.scenarios.map(s => {
                    const name = shortName(s.step);
                    // A failed URL has no page behind it: show no numbers at
                    // all rather than ones that belong to another page.
                    if (s.failed) {
                      const why = s.notAPage ? '_not a web page (file download)_' : '_failed_';
                      return `| ${name} | — | — | — | ${why} |`;
                    }
                    const kb = (s.transferBytes / 1024).toFixed(0) + ' KB';
                    const co2 = s.co2Grams != null ? (s.co2Grams * 1000).toFixed(3) + ' mg' : '—';
                    // "Not measured" (no power hardware) and "not resolved"
                    // (measured, but below the noise floor) are different
                    // statements; conflating them misreports the host.
                    const energy = !entry.energyAvailable
                      ? '_not measured_'
                      : (s.resolved && s.energyMwh != null)
                        ? s.energyMwh.toFixed(3) + ' mWh'
                        : '_not resolved_';
                    return `| ${name} | ${kb} | ${s.requests} | ${co2} | ${energy} |`;
                  }),
                ].join('\n');
              }
            } catch (e) {
              table = '\n_Could not summarise results._';
            }
            const failedRows = ((entry && entry.scenarios) || []).filter((s) => s.failed);
            const energyMeasured = !!(entry && entry.energyAvailable);

            // Lighthouse is a separate engine and boundary, so it gets its own
            // table rather than extra columns on the Firefox one.
            let lighthouseBlock = '';
            const lh = entry && entry.lighthouse;
            if (lh) {
              const sec = (ms) => (ms == null ? '—' : (ms / 1000).toFixed(1) + ' s');
              // The rating is written out so the score never relies on colour.
              const rating = (n) => (n == null ? '' : n >= 90 ? ' good' : n >= 50 ? ' needs improvement' : ' poor');
              const audited = entry.scenarios
                .filter((s) => s.lighthouse)
                .map((s) => ({ url: s.step, r: s.lighthouse }))
                .concat((lh.unmatched || []).map((r) => ({ url: r.url, r })));
              const extraCats = lh.categories.filter((c) => c !== 'performance');
              const rows = audited.map(({ url, r }) => {
                if (r.error && !r.runs) return `| ${shortName(url)} | _failed_ | — | — | — | — |` + extraCats.map(() => ' — |').join('');
                const perf = r.scores.performance;
                const range = r.performanceRange && r.performanceRange[0] !== r.performanceRange[1]
                  ? ` (${r.performanceRange[0]}–${r.performanceRange[1]})` : '';
                const top = r.recommendations[0] ? r.recommendations[0].title : '—';
                return `| ${shortName(url)} | **${perf ?? '—'}**${rating(perf)}${range} | ${sec(r.metrics.lcpMs)} | ` +
                  `${r.metrics.tbtMs ?? '—'} ms | ${r.metrics.cls ?? '—'} | ${top} |` +
                  extraCats.map((c) => ` ${r.scores[c] ?? '—'} |`).join('');
              });
              const catHead = extraCats.map((c) => ` ${c} |`).join('');
              const catSep = extraCats.map(() => ' ---: |').join('');
              const fmtSave = (x) => [
                x.medianSavingsMs ? '~' + (x.medianSavingsMs / 1000).toFixed(1) + ' s' : '',
                x.medianSavingsBytes ? '~' + Math.round(x.medianSavingsBytes / 1024) + ' KB' : '',
              ].filter(Boolean).join(', ');
              const common = (lh.sitewide || []).slice(0, 8).map((x) => {
                const save = fmtSave(x);
                const title = x.learnMore ? `[${x.title}](${x.learnMore})` : x.title;
                return `- ${title} — ${x.pages} of ${audited.length} page${audited.length === 1 ? '' : 's'}` +
                  (save ? ` · est. ${save} per page` : '');
              });
              const artifact = '${{ steps.lh-artifact.outputs.artifact-url }}';
              lighthouseBlock = [
                '',
                '### Lighthouse',
                '',
                `Lighthouse ${lh.version} in ${lh.browser || 'Chromium'}, ${lh.formFactor} profile, ` +
                  `${lh.throttling}. Median of ${lh.runsPerUrl} run${lh.runsPerUrl === 1 ? '' : 's'} per URL; ` +
                  'range in brackets.',
                '',
                `| Page | Performance | LCP | TBT | CLS | Top recommendation |${catHead}`,
                `| --- | ---: | ---: | ---: | ---: | --- |${catSep}`,
                ...rows,
                '',
                common.length ? '**Most common performance recommendations**' : null,
                common.length ? '' : null,
                ...common,
                common.length ? '' : null,
                'Failures shared by most pages usually come from the theme or a shared asset, so one fix lands everywhere.',
                '',
                artifact
                  ? `Full Lighthouse HTML reports (median run per URL) are in the [workflow artifact](${artifact}) for 14 days.`
                  : null,
                artifact ? '' : null,
                '_Lighthouse measures lab load performance in Chromium under simulated throttling. It is not ' +
                  'Firefox and not energy, and is reported beside those results, never combined with them._',
              ].filter((line) => line !== null).join('\n') + '\n';
            }

            const isCrawl = '${{ needs.prepare.outputs.mode }}' === 'crawl';

            // Structural findings need no power hardware, so they are the main
            // actionable output on a hosted runner.
            const allFindings = [];
            for (const s of ((entry && entry.scenarios) || [])) {
              for (const f of (s.findings || [])) {
                if (!allFindings.some((x) => x.id === f.id)) allFindings.push(f);
              }
            }
            const findingsBlock = allFindings.length
              ? '\n### Structural findings\n\n' +
                allFindings
                  .slice(0, 8)
                  .map((f) => `- **${f.severity.toUpperCase()}** ${f.title}\n  ${f.action}`)
                  .join('\n') +
                '\n\nThese come from page structure and need no power hardware, so they are ' +
                'valid on any runner.\n'
              : '';
            const parserNotes = `${{ needs.prepare.outputs.notes }}`.trim();

            const notes = [
              '',
              '**How to read this.** Modelled CO2e (CO2.js, from transferred bytes) and observed',
              'client energy (Firefox power counters) have different system boundaries and are not',
              'interchangeable. The measurement boundary is the client machine only — nothing here',
              'measures server or data-centre energy.',
              '',
              isCrawl
                ? '_Crawl mode measures each page **once**. That is enough to rank pages and find outliers, but a single run cannot separate a real difference from noise — use measure mode for comparisons._'
                : null,
              selfHostedUsed
                ? '_Ran on a self-hosted physical Apple Silicon runner, so energy was measured. Check the power-source and Low Power Mode flags in the result before comparing against other runs._'
                : fellBack
                  ? '_A self-hosted runner was requested but none was online, so this ran on a hosted runner. Structural metrics are complete; **no energy was measured**._'
                  : '_Ran on a GitHub-hosted runner, which has no power-measurement hardware. Network, CO2e, timing and page-structure metrics are all valid; **no energy was measured**._',
              '',
              energyMeasured
                ? '`not resolved` means the measured energy was smaller than its own run-to-run spread, ' +
                  'or at/below idle. Small static pages usually land here — there is nothing above the ' +
                  'noise floor to measure.'
                : '`not measured` means this host has no power-measurement hardware, so no energy reading ' +
                  'was taken. It is an absence, not a zero. Request the self-hosted Apple Silicon runner for energy.',
              failedRows.length
                ? `\n${failedRows.length} URL${failedRows.length === 1 ? '' : 's'} could not be measured. ` +
                  (failedRows.some((s) => s.notAPage)
                    ? 'Rows marked _not a web page_ start a file download (usually a PDF) instead of rendering, so ' +
                      'there is nothing for a browser to lay out or paint. Link to the HTML page that hosts the file instead.'
                    : 'See the full results for the error.')
                : null,
              parserNotes ? '\n**Notes on this request:**\n' + parserNotes.split('\n').map(n => '- ' + n).join('\n') : null,
              '',
              'Full results: https://mgifford.github.io/firefox-energy-scanner/',
            // Conditionals yield null when omitted; '' entries are deliberate
            // blank lines. filter(Boolean) dropped both, which collapsed every
            // paragraph break in the comment.
            ].filter((line) => line !== null).join('\n') + findingsBlock + lighthouseBlock +
              '\n\n---\n_Scan complete, so this issue is now closed. **Reopen it to run the ' +
              'scan again** — edit the request body first if you want different settings._';

            const issue_number = Number('${{ needs.prepare.outputs.issue }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '## Scan complete\n' + table + '\n' + notes,
            });

            // The issue is the run control: closed means finished, and
            // reopening triggers a fresh scan (see the `reopened` trigger).
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed',
              state_reason: 'completed',
            });

      # If any earlier step failed the success comment is skipped, which would
      # otherwise leave the request open with no explanation. Say what happened
      # and leave the issue OPEN, since it has not been serviced.
      - name: Report a failed scan
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.prepare.outputs.issue }}'),
              body: [
                '## Scan failed',
                '',
                `The scan did not complete. [View the run log](${run}).`,
                '',
                'This issue stays open because the request has not been serviced.',
                'Common causes: the target was unreachable, or it did not respond within',
                'the time budget. Close and reopen this issue to retry.',
              ].join('\n'),
            });

  report-invalid:
    needs: prepare
    if: needs.prepare.outputs.valid != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Explain why the request was rejected
        uses: actions/github-script@v7
        with:
          script: |
            const errors = `${{ needs.prepare.outputs.errors }}`.trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.prepare.outputs.issue }}'),
              body: [
                '## Scan request could not be processed',
                '',
                errors || 'No valid public http(s) URLs were found in this request.',
                '',
                'Only public web URLs can be scanned. Localhost and private addresses are rejected',
                'because a hosted runner cannot reach them.',
                '',
                'Fix the request body, then close and reopen this issue to try again.',
              ].join('\n'),
            });
