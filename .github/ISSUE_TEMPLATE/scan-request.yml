name: Scan request
description: Scan public web pages for weight, modelled CO2e, page structure and Lighthouse performance.
title: "SCAN: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Scan request

        **Paste URLs — that is all that is required.** One URL crawls its site; a list
        scans just those pages. Every other field has a sensible default.

        > **Tip:** the [web form](https://mgifford.github.io/firefox-energy-scanner/)
        > fills this in for you. The issue title **must** begin with `SCAN:`.

  - type: textarea
    id: urls
    attributes:
      label: URLs
      description: >
        One public `https://` or `http://` URL per line, or comma-separated. **One URL**:
        the scanner crawls that site (www and non-www, http and https count as the same
        site) up to the page limit below. **Several URLs**: it scans exactly those, up to
        200; any more are listed in the results as not scanned.
      placeholder: |
        https://www.example.gov/
        https://www.example.gov/about
    validations:
      required: true

  - type: dropdown
    id: lighthouse
    attributes:
      label: Lighthouse
      description: >
        Google Lighthouse in Chromium, after the Firefox scan: Performance score, lab
        Core Web Vitals and the failing recommendations with estimated savings. It is a
        different engine, so its numbers sit beside the Firefox results.
      options:
        - Performance — the 10 heaviest pages
        - Performance — every page (slower)
        - All categories — the 10 heaviest pages
        - No
      default: 0
    validations:
      required: false

  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options:
        - Desktop (1280x800)
        - Tablet portrait (768x1024)
        - Tablet landscape (1024x768)
        - Mobile portrait (390x844)
        - Mobile landscape (844x390)
      default: 0
    validations:
      required: false

  - type: dropdown
    id: what
    attributes:
      label: What to scan
      options:
        - Auto — one URL crawls its site; several URLs scan just those
        - Only the listed URLs
        - Crawl the site from the first URL
      default: 0
    validations:
      required: false

  - type: input
    id: max-pages
    attributes:
      label: Maximum pages to crawl
      description: Used only when crawling. Up to 200; 50 pages takes about 5 minutes.
      value: "50"
    validations:
      required: false

  - type: dropdown
    id: where
    attributes:
      label: Where to run
      description: >
        GitHub's cloud machines are virtual and **cannot measure energy** (tested on all
        of them). Energy needs a physical machine: run the scanner locally, or register
        one for this repository — see docs/local-energy.md.
      options:
        - Auto — an energy-measuring machine if one is set up, otherwise GitHub's cloud
        - GitHub's cloud only (no energy)
      default: 0
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: These are public URLs that I am permitted to scan.
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        The scan starts when this issue is saved. A comment confirms it has started, and
        the results are posted here when it finishes. **The issue then closes; reopen it to
        scan again** (edit it first to change anything). A rejected or failed request stays
        open: edit it, and saving runs it again. The `rescan` label also re-runs any request.
